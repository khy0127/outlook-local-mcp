[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-local-mcp"
version = "0.1.0"
description = "Local MCP server for classic desktop Outlook on Windows (COM). Read, search, move, archive and draft; no send, no delete."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
outlook-local-mcp = "outlook_local_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
